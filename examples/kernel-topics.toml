# A list file for `rhizoid assemble`, laid out as linux-phone-oco's kernel labs use it - one example among any.
# rhizoid owns the format; each user owns its file. Every name below is the file's choice, not rhizoid's.

name = "walleye"                            # {name} in the tag; optional
tag = "int/{name}/{list}/{base}/{n}"        # the tag template (this is also the default when a file has a name)
branches = ["topic/ITEM", "backport/ITEM/BASE"]   # the branches a list may name; with none, any branch

# Two lists, two tags: never one tag for both.
[lists.ufs-off]
base = "v6.18"                      # a tag, or a commit

[[lists.ufs-off.entries]]
branch = "topic/panel-s6e3fa7"
for = "the display panel"
state = "known-good"                # known by a test run, on the commit it tested
test_run = "2026-11-20-walleye-display"
tested_commit = "29d92793b"         # a commit's sha (or a prefix of one): never HEAD or a branch, which move

[[lists.ufs-off.entries]]
branch = "backport/msm-pinctrl/v6.12"
for = "pinctrl fixes from v6.12"
state = "trying"                    # not known to work yet

[lists.ufs-on]
base = "v6.18"

[[lists.ufs-on.entries]]
branch = "topic/panel-s6e3fa7"
for = "the display panel"
state = "known-good"
test_run = "2026-11-20-walleye-display"
tested_commit = "29d92793b"

[[lists.ufs-on.entries]]
branch = "topic/ufs-walleye"
for = "UFS storage"
state = "trying"
