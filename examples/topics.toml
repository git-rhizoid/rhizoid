# A lab's list file for `rhizoid assemble` (rhizoid owns the format; each lab owns its file, kernel/topics.toml).
# One device; named lists, each a base and the branches merged onto it in order.

device = "walleye"

# Two lists, two tags: never one tag for both.
[lists.ufs-off]
base = "v6.18"                      # a tag, or a fork's commit

[[lists.ufs-off.entries]]
branch = "topic/panel-s6e3fa7"      # topic/ITEM
for = "the display panel"
state = "known-good"                # known by a test run, on the commit it tested
test_run = "2026-11-20-walleye-display"
tested_commit = "29d92793b"

[[lists.ufs-off.entries]]
branch = "backport/msm-pinctrl/v6.12"   # backport/ITEM/BASE
for = "pinctrl fixes from v6.12"
state = "trying"                    # not known to work yet

[lists.ufs-on]
base = "v6.18"

[[lists.ufs-on.entries]]
branch = "topic/panel-s6e3fa7"
for = "the display panel"
state = "known-good"
test_run = "2026-11-20-walleye-display"
tested_commit = "29d92793b"

[[lists.ufs-on.entries]]
branch = "topic/ufs-walleye"
for = "UFS storage"
state = "trying"
