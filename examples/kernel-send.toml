# rhizoid's config for `rhizoid send-back`, as a Linux kernel tree would use it - one example among any. Every
# name and command is the config's, not rhizoid's. Checks run in the rebased worktree, in order; an exit but 0
# fails the draft unless the step says `fails = false` (its findings are then reported in SEND-NOTES and count
# for nothing). A check's exceptions are its own arguments.

[send]
branch = "send/{leaf}/v{n}"         # the send branch ({branch}, {leaf}, one {n}); this is the default
draft_tag = "{branch}/v{n}-draft"   # a draft's tag; the default
tag = "{branch}/v{n}"               # a version sent: the author tags his signed tip so; drafts are numbered past it
testing = "Testing: <from evidence rows>"   # the cover letter's testing line, a marked blank for the author

# An unsigned draft always lacks a Signed-off-by, and in a shallow tree a Fixes: id cannot resolve: expected of
# every draft. This run reports them (and everything else) and counts for nothing...
[[send.check]]
name = "checkpatch-all"
run = ["scripts/checkpatch.pl", "--strict"]
patches = true
fails = false

# ...and this one fails the draft on any other finding.
[[send.check]]
name = "checkpatch"
run = ["scripts/checkpatch.pl", "--strict", "--ignore", "MISSING_SIGN_OFF,UNKNOWN_COMMIT_ID,BAD_FIXES_TAG"]
patches = true

[[send.check]]
name = "w1"
run = ["make", "-j8", "W=1", "drivers/gpu/drm/panel/"]

[[send.check]]
name = "dt-check"
run = ["make", "dt_binding_check", "DT_SCHEMA_FILES=display/panel"]

[send.recipients]                   # each line it prints is a recipient; rhizoid sends nothing
name = "get_maintainer"
run = ["scripts/get_maintainer.pl", "--no-rolestats"]
patches = true
