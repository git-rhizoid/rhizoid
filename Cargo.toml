[workspace]
resolver = "2"
members = ["crates/rhizoid-core", "crates/rhizoid-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/git-rhizoid/rhizoid"
authors = ["git-rhizoid"]

[workspace.dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
schemars = "0.8.21"
toml = "0.8.19"
argenv = { version = "0.1", features = ["contract"] }
