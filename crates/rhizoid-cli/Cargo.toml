[package]
name = "rhizoid-cli"
description = "Fork, own, and sync git dependencies (rhizoid-cuttings) instead of relying on a package manager."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rhizoid"
path = "src/main.rs"

[dependencies]
rhizoid-core = { path = "../rhizoid-core" }
argenv = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
