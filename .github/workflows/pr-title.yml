name: PR Title

# Plain pull_request, not pull_request_target: the latter reads the workflow
# file from the base branch, which means a workflow introduced in the same PR
# that adds it can never fire on that PR.
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    name: conventional commit format
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
          # No fixed scope list here, unlike a mature project's CI - a fresh
          # repo doesn't have established parts yet. Add one (see argenv's
          # pr-title.yml for the pattern) once the shape of the project settles.
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject after "type(scope): " must not start with an
            uppercase letter - keep it lowercase, imperative mood.
