name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # Same requirement as ci.yml: .cargo/config.toml needs mold, not present on a bare Actions
      # runner. release-plz builds the package to verify the tarball before it will tag/publish,
      # so it hits the same missing-linker failure ci.yml already works around - found for real,
      # the first release attempt on this repo failed here ("cannot find 'ld'") because this
      # workflow didn't have the same fix yet.
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add the CARGO_REGISTRY_TOKEN repo secret before this crate is meant
          # to actually publish. Until then, this step still correctly
          # maintains the release PR (changelog + version bump) on every push
          # to main - only the `cargo publish` at the end of a cut release
          # needs the token, and that only runs once a release PR is merged.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
